name: CI — Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - "src/frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  build-lint-typecheck:
    name: Build, Lint & Type-Check (Next.js 15)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          AUTH0_SECRET: ci_placeholder_secret_32_chars_long
          AUTH0_BASE_URL: http://localhost:3000
          AUTH0_ISSUER_BASE_URL: https://placeholder.auth0.com
          AUTH0_CLIENT_ID: placeholder_client_id
          AUTH0_CLIENT_SECRET: placeholder_client_secret
          NEXT_PUBLIC_API_URL: http://localhost:5000
