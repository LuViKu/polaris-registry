name: CI — Backend

on:
  push:
    branches: [main, develop]
    paths:
      - "src/backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: registry_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore src/backend/OphthalmicRegistry.sln

      - name: Build
        run: dotnet build src/backend/OphthalmicRegistry.sln --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test src/backend/OphthalmicRegistry.sln
          --no-build
          --configuration Release
          --filter "Category=Unit"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./test-results

      - name: Run integration tests
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=registry_test;Username=test_user;Password=test_password"
        run: >
          dotnet test src/backend/OphthalmicRegistry.sln
          --no-build
          --configuration Release
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/*.trx
