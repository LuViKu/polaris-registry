name: Deploy — Staging

on:
  push:
    branches: [develop]

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build backend
        run: dotnet publish src/backend/OphthalmicRegistry.API/OphthalmicRegistry.API.csproj -c Release -o ./publish/backend

      - name: Build frontend
        run: |
          cd src/frontend
          npm ci
          npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/ophthalmic-registry
            git pull origin develop
            docker compose pull
            docker compose up -d --build
            docker compose exec backend dotnet OphthalmicRegistry.API.dll migrate
